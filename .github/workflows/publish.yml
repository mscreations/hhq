name: Publish image to GHCR

# Builds and pushes the Docker image whenever version-dev.yml or
# version-main.yml pushes a new version tag - every meaningful push to dev
# or main produces exactly one such tag, so this is effectively "build on
# every dev/main push that matters" without racing the tag's own creation.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and floating tag
        id: vars
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-dev ]]; then
            echo "floating=latest-dev" >> "$GITHUB_OUTPUT"
          else
            echo "floating=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ghcr.io/mscreations/hhq:${{ steps.vars.outputs.version }}
            ghcr.io/mscreations/hhq:${{ steps.vars.outputs.floating }}
