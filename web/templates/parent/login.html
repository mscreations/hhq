{{define "parent/login"}}
<!DOCTYPE html>
<html lang="en">
{{template "parent/_head" (dict "PageTitle" "Sign In" "AppTitle" .AppTitle)}}
<body class="login-body">
  <button id="theme-toggle-btn" class="theme-toggle login-theme-toggle" onclick="toggleTheme()">Dark Mode</button>
  <form class="login-card" method="POST" action="/login">
    <h1>{{.AppTitle}}</h1>
    <p class="subtitle">Parent sign in</p>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Email<input type="email" name="email" required autofocus></label>
    <label>Password<input type="password" name="password" required></label>
    <button type="submit">Sign In</button>
    <p class="subtitle"><a href="/forgot-password">Forgot password?</a></p>
  </form>

  <script src="/static/js/parent.js"></script>
</body>
</html>
{{end}}
