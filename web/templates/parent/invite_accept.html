{{define "parent/invite_accept"}}
<!DOCTYPE html>
<html lang="en">
{{template "parent/_head" (dict "PageTitle" "Accept Invite" "AppTitle" .AppTitle)}}
<body class="login-body">
  <button id="theme-toggle-btn" class="theme-toggle login-theme-toggle" onclick="toggleTheme()">Dark Mode</button>
  <form class="login-card" method="POST" action="/invite/accept">
    <h1>{{.AppTitle}}</h1>
    <p class="subtitle">Finish creating your account</p>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    {{if .Token}}
    <input type="hidden" name="token" value="{{.Token}}">
    <p>Name: <strong>{{.Name}}</strong></p>
    <p>Email: <strong>{{.Email}}</strong></p>
    <label>Password<input type="password" name="password" required autofocus></label>
    <label>Confirm password<input type="password" name="confirm_password" required></label>
    <button type="submit">Set Password &amp; Sign In</button>
    {{else}}
    <p><a href="/login">Go to login</a></p>
    {{end}}
  </form>

  <script src="/static/js/parent.js"></script>
</body>
</html>
{{end}}
