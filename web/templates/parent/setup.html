{{define "parent/setup"}}
<!DOCTYPE html>
<html lang="en">
{{template "parent/_head" (dict "PageTitle" "Initial Setup" "AppTitle" .AppTitle)}}
<body class="login-body">
  <button id="theme-toggle-btn" class="theme-toggle login-theme-toggle" onclick="toggleTheme()">Dark Mode</button>
  <form class="login-card" method="POST" action="/setup">
    <h1>{{.AppTitle}}</h1>
    <p class="subtitle">Create the first parent account to finish setting up</p>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <label>Your name<input type="text" name="name" required autofocus></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required></label>
    <label>Confirm password<input type="password" name="confirm_password" required></label>
    <button type="submit">Create Account</button>
  </form>

  <script src="/static/js/parent.js"></script>
</body>
</html>
{{end}}
