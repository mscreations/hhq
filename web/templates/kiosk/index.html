{{define "kiosk/index"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{.AppTitle}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/kiosk.css">
</head>
<body>
  <header class="kiosk-header">
    <h1>{{.AppTitle}}</h1>
    <div id="clock" class="clock"></div>
    <div class="weather-widget" hx-get="/kiosk/weather/page" hx-target="#kiosk-view" hx-swap="innerHTML"
         hx-on::before-request="setActiveNav('weather')">
      <div id="weather-content" hx-get="/kiosk/fragments/weather" hx-trigger="every 60s" hx-target="this" hx-swap="innerHTML">{{template "kiosk/_weather" .Weather}}</div>
    </div>
  </header>

  <main id="kiosk-view">
    {{template "kiosk/_home" .}}
  </main>

  <nav class="kiosk-navbar">
    <button type="button" class="nav-btn active" data-nav="home"
            hx-get="/kiosk/fragments/home" hx-target="#kiosk-view" hx-swap="innerHTML"
            hx-on::before-request="setActiveNav('home')">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="nav-home-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fb7185"/><stop offset="100%" stop-color="#dc2626"/></linearGradient><linearGradient id="nav-home-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#0284c7"/></linearGradient><linearGradient id="nav-home-door" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs><path d="M12 3.2 3 11h18z" fill="url(#nav-home-roof)"/><path d="M5.5 11H10v9H5.5z" fill="url(#nav-home-wall)"/><path d="M14 11h4.5v9H14z" fill="url(#nav-home-wall)"/><rect x="10" y="14" width="4" height="6" fill="url(#nav-home-door)"/></svg>
      <span>Home</span>
    </button>
    <button type="button" class="nav-btn" data-nav="weather"
            hx-get="/kiosk/weather/page" hx-target="#kiosk-view" hx-swap="innerHTML"
            hx-on::before-request="setActiveNav('weather')">
      {{template "kiosk/_weather_icon" "cloud-sun"}}
      <span>Weather</span>
    </button>
    {{range .Plugins}}
    <button type="button" class="nav-btn" data-nav="plugin-{{.ID}}"
            hx-get="/kiosk/view/plugin/{{.ID}}" hx-target="#kiosk-view" hx-swap="innerHTML"
            hx-on::before-request="setActiveNav('plugin-{{.ID}}')">
      {{if .IconHTML}}{{.IconHTML}}{{else}}{{template "kiosk/_plugin_default_icon"}}{{end}}
      <span>{{.Label}}</span>
    </button>
    {{end}}
    <a href="/parent" class="nav-btn nav-btn-parent">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="nav-parent-head" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fed7aa"/><stop offset="100%" stop-color="#ea9a5c"/></radialGradient><linearGradient id="nav-parent-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4338ca"/></linearGradient></defs><circle cx="12" cy="8" r="4" fill="url(#nav-parent-head)"/><path d="M4 20a8 8 0 0 1 16 0z" fill="url(#nav-parent-body)"/></svg>
      <span>Parent Dashboard</span>
    </a>
  </nav>

  <div id="event-modal" class="modal-backdrop" onclick="if(event.target===this){this.classList.remove('open');}">
    <div class="modal-card">
      <button type="button" class="modal-close" aria-label="Close" onclick="document.getElementById('event-modal').classList.remove('open')">&times;</button>
      <div id="event-modal-body"></div>
    </div>
  </div>

  <div id="chore-confirm-modal" class="modal-backdrop" onclick="if(event.target===this){closeChoreConfirm();}">
    <div class="modal-card">
      <button type="button" class="modal-close" aria-label="Close" onclick="closeChoreConfirm()">&times;</button>
      <h3 id="chore-confirm-name"></h3>
      <p id="chore-confirm-description" class="chore-confirm-description"></p>
      <div class="chore-confirm-actions">
        <button type="button" class="chore-confirm-btn chore-confirm-btn-confirm" onclick="confirmChoreComplete()">Confirm</button>
        <button type="button" class="chore-confirm-btn chore-confirm-btn-cancel" onclick="closeChoreConfirm()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/kiosk.js"></script>
</body>
</html>
{{end}}
