{{- if or .Values.bootstrap.children .Values.bootstrap.chores .Values.bootstrap.assignments .Values.bootstrap.calendars }}
# Non-secret bootstrap files, read by hhq at startup from CONFIG_DIR (see
# cmd/server/main.go's bootstrapFromFile calls). calendars.json entries
# should use password_file (a path from bootstrap.extraMounts) rather than a
# plain password, since this ConfigMap's contents are not encrypted at rest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hhq.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hhq.labels" . | nindent 4 }}
data:
  {{- if .Values.bootstrap.children }}
  children.json: {{ toJson .Values.bootstrap.children | quote }}
  {{- end }}
  {{- if .Values.bootstrap.chores }}
  chores.json: {{ toJson .Values.bootstrap.chores | quote }}
  {{- end }}
  {{- if .Values.bootstrap.assignments }}
  assignments.json: {{ toJson .Values.bootstrap.assignments | quote }}
  {{- end }}
  {{- if .Values.bootstrap.calendars }}
  calendars.json: {{ toJson .Values.bootstrap.calendars | quote }}
  {{- end }}
{{- end }}
