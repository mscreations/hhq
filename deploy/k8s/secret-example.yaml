# EXAMPLE ONLY. Do not commit real secrets to source control.
# Apply this with real values via `kubectl apply -f` (from a local, untracked
# copy) or better, generate it with `kubectl create secret generic ...`,
# or manage it via Sealed Secrets / External Secrets / SOPS in a GitOps setup.
#
# Generate ENCRYPTION_KEY with:
#   openssl rand -hex 32   -> ENCRYPTION_KEY (must be exactly 32 bytes hex = 64 chars)
#
# SESSION_SECRET / APPROVAL_SECRET / INVITE_SECRET / PASSWORD_RESET_SECRET are OPTIONAL - if you leave
# them unset, the app generates one on first startup and stores it encrypted
# (using ENCRYPTION_KEY) in the settings table, so only ENCRYPTION_KEY needs
# to be provided here. Set one explicitly only if you need a stable, operator-
# controlled value (e.g. to keep sessions valid across a database restore that
# predates a given secret).
apiVersion: v1
kind: Secret
metadata:
  name: hhq-app-secrets
  namespace: hhq
type: Opaque
stringData:
  ENCRYPTION_KEY: "REPLACE_ME_64_HEX_CHARS"
  # Only used on first startup, when no parent user exists yet - creates your
  # initial login. Safe to leave here after (it becomes a no-op once a parent
  # exists), but for tidiness you can remove these three keys once you've
  # confirmed you can log in.
  BOOTSTRAP_PARENT_NAME: "Parent"
  BOOTSTRAP_PARENT_EMAIL: "you@example.com"
  BOOTSTRAP_PARENT_PASSWORD: "REPLACE_ME"
  # Optional: set this to a path mounted from the hhq-bootstrap-config Secret
  # below (e.g. "/config/parent-avatar.png") to give the initial parent an
  # avatar as soon as they're created. Only applied once, at creation time -
  # safe to leave set afterward, it's a no-op once the parent already exists.
  # BOOTSTRAP_PARENT_AVATAR_FILE: "/config/parent-avatar.png"

---
# Optional: bootstrap calendar accounts/children/chores/schedules on every
# startup instead of adding them one at a time via the dashboard, by mounting
# this Secret as a volume at CONFIG_DIR (default /config - see
# deployment.yaml's commented-out volumeMount). Each key below becomes a file
# in that directory; include only the ones you want (all four are optional).
# Every file is reconciled by name (or, for assignments.json, by child+chore)
# on every startup: new entries are created, existing entries that were
# themselves created by that file are kept in sync with it, and anything
# added via the dashboard is left untouched even if its name collides. See
# README.md's "Bootstrap config files" section for the full field reference
# (provider aliases, day-of-week names, etc).
apiVersion: v1
kind: Secret
metadata:
  name: hhq-bootstrap-config
  namespace: hhq
type: Opaque
stringData:
  # Each entry's password can be given directly as password, or as
  # password_file (a path to a file holding just the password, e.g. if
  # you're sourcing it from a separately-mounted Secret rather than typing
  # it inline here) - setting both on the same entry is a startup-time
  # bootstrap error.
  calendars.json: |
    [
      {"name": "Mom's Fastmail", "provider": "fastmail", "username": "mom@fastmail.com", "password": "app-specific-password"},
      {"name": "Dad's iCloud", "provider": "icloud", "username": "dad@icloud.com", "password_file": "/config/dad-icloud-password"}
    ]
  children.json: |
    [
      {"name": "Alex"},
      {"name": "Sam", "color": "#3B82F6", "avatar_file": "sam-avatar.png"}
    ]
  chores.json: |
    [
      {"name": "Take out trash", "description": "Bins go to the curb Tuesday night"},
      {"name": "Feed the dog"}
    ]
  assignments.json: |
    {
      "Alex": [
        {"chore": "Take out trash", "points": 5, "days_of_week": ["tue", "fri"]}
      ],
      "Sam": [
        {"chore": "Feed the dog", "points": 2, "one_off_date": "2026-08-01"}
      ]
    }
# avatar_file/BOOTSTRAP_PARENT_AVATAR_FILE point at image files, which also
# need to land in this same directory - since those are binary, not text,
# don't hand-type them under stringData above. Instead add them with:
#   kubectl create secret generic hhq-bootstrap-config -n hhq --dry-run=client -o yaml \
#     --from-file=children.json --from-file=chores.json --from-file=assignments.json --from-file=calendars.json \
#     --from-file=sam-avatar.png --from-file=parent-avatar.png | kubectl apply -f -
# (or add matching `data:` keys, base64-encoded, if managing this file by hand
# / via Sealed Secrets / SOPS instead).

---
# Provided separately (per your setup) with SMTP relay credentials.
apiVersion: v1
kind: Secret
metadata:
  name: hhq-smtp
  namespace: hhq
type: Opaque
stringData:
  SMTP_HOST: "smtp.example.com"
  SMTP_USER: "hhq@example.com"
  SMTP_PASSWORD: "REPLACE_ME"
  # SMTP_PORT / SMTP_USE_TLS / SMTP_STARTTLS are set in the ConfigMap by default
  # (587 + STARTTLS); override per-key here with stringData if your relay differs,
  # e.g. for implicit TLS on port 465 add SMTP_PORT: "465" and SMTP_USE_TLS: "true"
  # to this secret (a Secret key takes precedence if you also list it in the
  # deployment's env before the ConfigMap ref - see deployment.yaml comments).

---
# NOTE: Database credentials are NOT defined here. This deployment reads them
# directly from the Secret CloudNativePG already generates for your Cluster,
# conventionally named "<cluster-name>-app" (e.g. "myapp-postgres-app" per your
# setup). Verify the exact key names in your cluster with:
#   kubectl get secret myapp-postgres-app -n <namespace> -o jsonpath='{.data}' | jq 'keys'
# CNPG's generated -app secret typically includes: user, password, dbname, host,
# port, uri, jdbc-uri. deployment.yaml maps user/password/dbname/host/port from
# that secret to this app's DB_USER/DB_PASSWORD/DB_NAME/DB_HOST/DB_PORT env vars.
